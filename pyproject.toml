[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentlens-benchmarks"
version = "0.1.0"
description = "Ground truth, experiment orchestration, and evaluation for IncidentLens"
requires-python = ">=3.10"
dependencies = [
    "incidentlens>=0.1",
    "urban-observation-processing>=0.1,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluation*", "utilities*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.csv", "*.kml", "*.jpg"]
